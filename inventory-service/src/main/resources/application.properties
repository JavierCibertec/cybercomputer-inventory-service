spring.application.name=inventory-service
server.address=${INVENTORY_BIND_ADDRESS:127.0.0.1}
server.port=${INVENTORY_PORT:8092}

spring.datasource.url=jdbc:mysql://${INVENTORY_DB_HOST:127.0.0.1}:${INVENTORY_DB_PORT:3306}/${INVENTORY_DB_NAME:cybercomputer_inventory}?connectionTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jackson.deserialization.accept-float-as-int=false

app.jwt.secret-base64=oviqb2813yYp9kMT4VxMIAyruqNhK8qUJeJliWCyOk0=
app.jwt.issuer=cybercomputer

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
